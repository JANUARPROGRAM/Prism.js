<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Prism.js – benchmark di perangkatmu</title>
	<style>
		body { font: 15px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 1rem auto; padding: 0 1rem; }

	<div id="status"></div>

	<table id="table"><thead><tr><th>Skenario</th><th>Hasil</th></tr></thead><tbody></tbody></table>
