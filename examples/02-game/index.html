<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="icon" href="data:,">
	<title>Prism Dodge</title>
	<style>
		:root { --bg: #0b0d17; --fg: #e8ecff; --dim: #8d96c4; color-scheme: dark; box-sizing: border-box;
			padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
		html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
		body { height: 100%; margin: 0; position: relative; overflow: hidden; background: var(--bg); color: var(--fg);
			font: 16px/1.4 system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
		canvas { display: block; width: 100%; height: 100%; touch-action: none; }
		#hud { position: absolute; inset: 12px 16px auto; display: flex; justify-content: space-between;
			font-size: 20px; font-variant-numeric: tabular-nums; pointer-events: none; }
		#best { color: var(--dim); }
		#msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
			justify-content: center; gap: 8px; padding: 24px; text-align: center; pointer-events: none; }
		#msg[hidden] { display: none; }
		h1 { margin: 0; font-size: 32px; }
		p { margin: 0; max-width: 28ch; color: var(--dim); }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="hud"><span id="score">0</span><span id="best"></span></div>
	<div id="msg"><h1 id="title">Prism Dodge</h1><p id="hint">Geser jari (atau ← →) untuk menghindar. Ambil koin kuning.</p><p>Ketuk untuk mulai</p></div>
	<script type="module" src="./game.js"></script>
</body>
</html>
